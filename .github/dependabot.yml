version: 2
updates:
  # GitHub Actions. Every action in this repository is pinned to a full commit
  # SHA (repo policy sha_pinning_required=true), so Dependabot must move the
  # SHA and keep the trailing version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Python. Runtime and dev dependencies live in pyproject.toml; the dev extra
  # carries the test and lint toolchain.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
